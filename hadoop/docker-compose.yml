# Mini-cluster Hadoop pseudo-distribué (HDFS + YARN) basé sur l'image officielle Apache (+ python3).
# Lancement : docker compose -f hadoop/docker-compose.yml up -d
services:
  namenode:
    image: hadoop-wordcount:3.4.1
    build: .              # apache/hadoop:3.4.1 + python3 (voir Dockerfile)
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # interface web HDFS
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ../data:/donnees:ro     # fichiers générés, visibles dans le conteneur
      - ./:/jobs:ro           # mapper.py / reducer.py pour Hadoop Streaming
  datanode:
    image: hadoop-wordcount:3.4.1
    pull_policy: never    # image construite localement par le service namenode
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
  resourcemanager:
    image: hadoop-wordcount:3.4.1
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"   # interface web YARN
    env_file:
      - ./config
  nodemanager:
    image: hadoop-wordcount:3.4.1
    pull_policy: never    # image construite localement par le service namenode
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
